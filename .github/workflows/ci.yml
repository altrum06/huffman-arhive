name: CI

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target huffman_app
      - name: Build and run tests
        run: |
          cmake --build build --target huffman_run_tests
          ./build/huffman_run_tests

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target huffman_app --config Release
      - name: Build and run tests
        run: |
          cmake --build build --target huffman_run_tests --config Release
          Copy-Item build\_deps\cmocka-build\src\Release\cmocka.dll build\Release\
          .\build\Release\huffman_run_tests.exe